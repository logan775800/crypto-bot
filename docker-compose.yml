services:
  crypto-bot:
    # 用本仓库的 Dockerfile 预装依赖(pip 固化在镜像层)，容器启动时不再现装。
    # requirements.txt 没变时 Docker 层缓存直接命中 → 部署由「几分钟」降到「秒级」。
    build: .
    image: crypto-bot:local
    container_name: crypto-bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_JOB: ${JENKINS_JOB:-update-crypto-bot}
      JENKINS_DEPLOY_TOKEN: ${JENKINS_DEPLOY_TOKEN:-}
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      # Bybit 实盘台/网格/AI查账户用。缺这三行 → 容器拿不到密钥，功能全部失效
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      BYBIT_TESTNET: ${BYBIT_TESTNET:-true}
      # 币安交易（合约+现货）。默认测试网，改 false 才是实盘
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      # 实盘下单硬开关：off = 任何命令都开不了（给「我不做实盘」用）
      LIVE_TRADING: ${LIVE_TRADING:-}
      # 频道搬运（用个人账号读订阅的频道）。没配就整个功能不启用。
      # ⚠️ TG_SESSION 等于账号凭证，别提交别外发
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION: ${TG_SESSION:-}
      TZ: Asia/Shanghai
    # 依赖已在镜像里，直接跑；源码仍由 ./:/app 挂载提供（改代码不必重建镜像）
    command: python bot.py
